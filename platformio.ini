[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Real prototype on the plot's Wi-Fi, sending to the Edge Service (needs src/Secrets.h): pio run -e board -t upload
[env:board]
extends = env:esp32dev
build_flags = -DREAL_BOARD=1

; Bench demo on the real prototype over USB, without Wi-Fi: pio run -e bench -t upload
[env:bench]
extends = env:esp32dev
build_flags = -DREAL_BOARD=1 -DOFFLINE_MODE=1
