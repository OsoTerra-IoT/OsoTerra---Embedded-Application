[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Bench demo on the real prototype over USB, without Wi-Fi: pio run -e bench -t upload
[env:bench]
extends = env:esp32dev
build_flags = -DOFFLINE_MODE=1 -DPUMP_RELAY_ACTIVE_LOW=1
